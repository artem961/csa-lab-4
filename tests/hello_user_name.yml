# hello_user_name — спросить имя, считать его через прерывания, поздороваться.
# Логика ввода целиком в обработчике: символы имени копятся в буфер buf
source: |-
  (def buf (alloc 32))
  (def pos 0)
  (def c 0)

  (interrupt-handler 1 (lambda ()
      (block
          (set c (in 1))
          (if (= c 0)
              (block
                  (aset buf pos 0)
                  (out-str 1 "Hello, ")
                  (out-str 1 buf)
                  (out-str 1 "!"))
              (block
                  (aset buf pos c)
                  (set pos (+ pos 1)))))))

  (out-str 1 "What is your name?")
  (while #t 0)

limit: 2600
memory-size: 128

ports-input:
  1:
    - [800, 'A']
    - [950, 'l']
    - [1100, 'i']
    - [1250, 'c']
    - [1400, 'e']
    - [1550, 0]

journal-head: 70
journal-tail: 30

