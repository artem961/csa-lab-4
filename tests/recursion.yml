# Рекурсия: вычисление факториала через самовызов.
# fact(10) = 3628800
source: |-
  (def fact (lambda (n)
    (if (= n 0)
      1
      (* n (fact (- n 1))))))
  (out 1 (fact 10))

limit: 2000
memory-size: 256

journal-head: 40
journal-tail: 20

expected_ast: |-
  Definition (variable: fact):
    Lambda (args: n):
      Condition (IF):
        [Condition]:
          Call: =
            Symbol: n
            Number: 0
        [Then]:
          Number: 1
        [Else]:
          Call: *
            Symbol: n
            Call: fact
              Call: -
                Symbol: n
                Number: 1
  ----------------------------------------
  IO (OUT, port: 1):
    Call: fact
      Number: 10
