# Euler Project #6: разность квадрата суммы и суммы квадратов первых 100 натуральных чисел.
# sum(1..100) = 5050, sum_of_squares(1..100) = 338350
# Ответ: 5050^2 - 338350 = 25502500 - 338350 = 25164150
source: |-
  (def sum_sq 0)
  (def sum 0)
  (def i 1)
  (while (< i 101)
    (block
      (set sum_sq (+ sum_sq (* i i)))
      (set sum (+ sum i))
      (set i (+ i 1))))
  (out 1 (- (* sum sum) sum_sq))

limit: 20000
memory-size: 128

journal-head: 30
journal-tail: 20

expected_ast: |-
  Definition (variable: sum_sq):
    Number: 0
  ----------------------------------------
  Definition (variable: sum):
    Number: 0
  ----------------------------------------
  Definition (variable: i):
    Number: 1
  ----------------------------------------
  Loop (WHILE):
    [Condition]:
      Call: <
        Symbol: i
        Number: 101
    [Body]:
      Block:
        Assignment (variable: sum_sq):
          Call: +
            Symbol: sum_sq
            Call: *
              Symbol: i
              Symbol: i
        Assignment (variable: sum):
          Call: +
            Symbol: sum
            Symbol: i
        Assignment (variable: i):
          Call: +
            Symbol: i
            Number: 1
  ----------------------------------------
  IO (OUT, port: 1):
    Call: -
      Call: *
        Symbol: sum
        Symbol: sum
      Symbol: sum_sq
