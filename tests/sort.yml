# sort — числа приходят через порт 1, терминатор = 0.
# По терминатору массив сортируется пузырьком и выводится обратно в порт 1.
source: |-
  (def arr (alloc 16))
  (def n 0)
  (def c 0)
  (def i 0)
  (def j 0)
  (def tmp 0)

  (def sort-and-print (lambda ()
    (block
      (set i 0)
      (while (< i n)
        (block
          (set j 0)
          (while (< j (- n 1))
            (block
              (if (> (aref arr j) (aref arr (+ j 1)))
                (block
                  (set tmp (aref arr j))
                  (aset arr j (aref arr (+ j 1)))
                  (aset arr (+ j 1) tmp))
                0)
              (set j (+ j 1))))
          (set i (+ i 1))))
      (set i 0)
      (while (< i n)
        (block
          (out 1 (aref arr i))
          (set i (+ i 1)))))))

  (interrupt-handler 1 (lambda ()
    (block
      (set c (in 1))
      (if (= c 0)
        (sort-and-print)
        (block
          (aset arr n c)
          (set n (+ n 1)))))))

  (while #t 0)

