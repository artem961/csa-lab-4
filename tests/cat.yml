# cat — эхо ввода через прерывания: обработчик печатает каждый пришедший символ,
# main крутит вечный цикл
source: |-
  (interrupt-handler 1 (lambda () (out 1 (in 1))))
  (while #t 0)

limit: 400
memory-size: 64

ports-input:
  1:
    - [20, 'c']
    - [70, 'a']
    - [120, 't']

journal-head: 55
journal-tail: 25

expected_ast: |-
  Interrupt handler (port: 1)
    Lambda (args: ):
      IO (OUT, port: 1):
        IO (IN, port: 1):
  ----------------------------------------
  Loop (WHILE):
    [Condition]:
      Boolean: #t
    [Body]:
      Number: 0
expected_listing: |-
  --- CODE @ 0x0000 ---
  0000 - 3000000011 - jmp 17         ; IP <- 17
  0001 - 3000000017 - jmp 23         ; IP <- 23
  0002 - 3000000016 - jmp 22         ; IP <- 22
