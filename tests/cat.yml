  000F - 3000000016 - jmp 22         ; IP <- 22
  0010 - 3000000016 - jmp 22         ; IP <- 22
  0011 - 0300000001 - ldi 1          ; AC <- 1
  0012 - 3100000015 - jz 21          ; if Z: IP <- 21
  0013 - 0300000000 - ldi 0          ; AC <- 0
  0014 - 3000000011 - jmp 17         ; IP <- 17
  0015 - FF00000000 - hlt            ; halt
  0016 - 6100000000 - iret           ; restore PS, AC, IP
  0017 - 5000000001 - in 1           ; AC <- Port[1]
  0018 - 5100000001 - out 1          ; Port[1] <- AC
  0019 - 6100000000 - iret           ; restore PS, AC, IP

  --- DATA @ 0x0000 ---
  0000 - 00000000   - data 0
expected_output: |-
  ticks: 400
  port 1: 3 words
    num:  [99, 97, 116]
    hex:  [0x63, 0x61, 0x74]
    text: 'cat'
