# Функции высшего порядка: lambda как значение, передача функции аргументом.
# apply(fun, a, b) вызывает fun(a, b) — одна обёртка для add, sub и mul.
source: |-
  (def add (lambda (a b) (+ a b)))
  (def sub (lambda (a b) (- a b)))
  (def mul (lambda (a b) (* a b)))
  ; Аргумент fun функции apply является функцией
  (def apply (lambda (fun a b) (fun a b)))
  (out 1 (apply add 1 2)) ; -> 3
  (out 1 (apply sub 1 2)) ; -> -1
  (out 1 (apply mul 1 2)) ; -> 2

limit: 500
memory-size: 128

journal-head: 40
journal-tail: 20

expected_ast: |-
  Definition (variable: add):
    Lambda (args: a, b):
      Call: +
        Symbol: a
        Symbol: b
  ----------------------------------------
  Definition (variable: sub):
    Lambda (args: a, b):
      Call: -
        Symbol: a
        Symbol: b
  ----------------------------------------
  Definition (variable: mul):
    Lambda (args: a, b):
      Call: *
        Symbol: a
        Symbol: b
  ----------------------------------------
  Definition (variable: apply):
    Lambda (args: fun, a, b):
      Call: fun
        Symbol: a
        Symbol: b
  ----------------------------------------
  IO (OUT, port: 1):
