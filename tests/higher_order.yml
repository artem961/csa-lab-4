# Функции высшего порядка: lambda как значение, передача функции аргументом.
# apply(f, x, y) вызывает f(x, y) — одна и та же обёртка для add и mul.
source: |-
  (def apply (lambda (f x y) (f x y)))
  (def add (lambda (a b) (+ a b)))
  (def mul (lambda (a b) (* a b)))
  (out 1 (apply add 3 4))
  (out 1 (apply mul 3 4))

limit: 500
memory-size: 128

journal-head: 40
journal-tail: 20

expected_ast: |-
  Definition (variable: apply):
    Lambda (args: f, x, y):
      Call: f
        Symbol: x
        Symbol: y
  ----------------------------------------
  Definition (variable: add):
    Lambda (args: a, b):
      Call: +
        Symbol: a
        Symbol: b
  ----------------------------------------
  Definition (variable: mul):
    Lambda (args: a, b):
      Call: *
        Symbol: a
        Symbol: b
  ----------------------------------------
  IO (OUT, port: 1):
    Call: apply
      Symbol: add
      Number: 3
      Number: 4
  ----------------------------------------
  IO (OUT, port: 1):
    Call: apply
      Symbol: mul
      Number: 3
      Number: 4
