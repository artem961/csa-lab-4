# 64-битное сложение программными средствами: hi/lo-разбиение 32-битных слов.
# a = 3 000 000 000 (хранится как -1294967296 = 0xB2D05E00 в дополнении до двух)
# b = 2 000 000 000
# Ожидаемый результат: 5 000 000 000 → (hi=1, lo=705032704)
source: |-
  (def a_hi 0)
  (def a_lo -1294967296)
  (def b_hi 0)
  (def b_lo 2000000000)

  (def a_lo_hi (/ a_lo 65536))
  (def a_lo_lo (% a_lo 65536))
  (def b_lo_hi (/ b_lo 65536))
  (def b_lo_lo (% b_lo 65536))

  (def sum_lo_lo (+ a_lo_lo b_lo_lo))
  (def carry1 (/ sum_lo_lo 65536))
  (def part_lo_lo (% sum_lo_lo 65536))

  (def sum_lo_hi (+ a_lo_hi b_lo_hi carry1))
  (def carry2 (/ sum_lo_hi 65536))
  (def part_lo_hi (% sum_lo_hi 65536))

  (def result_lo (+ (* part_lo_hi 65536) part_lo_lo))
  (def result_hi (+ a_hi b_hi carry2))

  (out 1 result_hi)
  (out 1 result_lo)

limit: 500
memory-size: 128

journal-head: 40
journal-tail: 20

