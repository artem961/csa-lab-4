# Шаблон golden-теста.
# Скопируйте в <name>.yml, впишите исходник и (при необходимости) расписание прерываний,
# затем выполните `uv run pytest --update-gold`, чтобы заполнить эталонные поля.
# Файл с расширением .yaml не подхватывается раннером (он ищет только *.yml).

# --- Входные данные ---

# Исходный код на Lisp:
source: |-
  (block
    (out-str 1 "Hello"))

# Ограничение по количеству тактов:
limit: 2000

# Размер памяти данных (в ячейках):
memory-size: 1024

# Расписание прерываний — как в config.yml: порт -> список [такт, значение].
# Значение задаётся числом или одиночным символом в кавычках. Можно опустить, если ввод не нужен.
ports-input:
  1:
    - [10, 'h']
    - [50, 'i']

# Обрезка журнала: сколько строк начала и конца сохранять (середина сворачивается).
# Подгоняется под алгоритм для репрезентативности. По умолчанию 60 / 30.
journal-head: 60
journal-tail: 30

# --- Эталоны (генерируются флагом --update-gold, вручную не заполняются) ---
# expected_ast: ...
# expected_listing: ...
# expected_output: ...
# expected_journal: ...